# Secret-gated e2e. The e2e environment must require reviewer approval and hold
# E2E_GEMINI_API_KEY; do not use a repository secret. This keeps a PR's code
# from receiving the key until a maintainer explicitly authorizes this run. Do
# not replace pull_request with pull_request_target.
name: e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    # Fork PRs cannot receive Actions secrets. Skip before requesting the
    # protected environment, so they do not wait for an approval that cannot
    # lead to an e2e run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: e2e
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - id: key
        env:
          GEMINI_API_KEY: ${{ secrets.E2E_GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo 'has_key=true' >>"$GITHUB_OUTPUT"
          else
            echo 'has_key=false' >>"$GITHUB_OUTPUT"
          fi

  e2e:
    needs: gate
    if: needs.gate.result == 'success' && needs.gate.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    environment: e2e
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          profile: minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install agy
        # Pinned agy release and SHA-256 are deliberate compatibility inputs, as is
        # the modelProvider: gemini config below. Run the local 1.1.16 preflight
        # from plans/completed/ci-workflow.md before merging this workflow.
        run: |
          AGY_VERSION=1.1.16
          AGY_ARCHIVE="$RUNNER_TEMP/agy_cli_linux_x64.tar.gz"
          AGY_SHA256=7742953b7835b457e9102f1357a493913657dfd147435584f609d58356ec085a
          curl --fail --location --retry 3 \
            --output "$AGY_ARCHIVE" \
            "https://github.com/google-antigravity/antigravity-cli/releases/download/${AGY_VERSION}/agy_cli_linux_x64.tar.gz"
          echo "${AGY_SHA256}  ${AGY_ARCHIVE}" | sha256sum --check --strict
          AGY_EXTRACT="$RUNNER_TEMP/agy-extract"
          mkdir -p "$AGY_EXTRACT" "$RUNNER_TEMP/bin"
          tar -xzf "$AGY_ARCHIVE" -C "$AGY_EXTRACT"
          AGY_BIN=$(find "$AGY_EXTRACT" -type f -name agy -perm -u+x -print -quit)
          test -n "$AGY_BIN"
          install -m 755 "$AGY_BIN" "$RUNNER_TEMP/bin/agy"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/bin/agy" --version
      - name: Configure agy for GEMINI_API_KEY
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          printf '%s\n' '{"modelProvider":"gemini"}' \
            >"$HOME/.gemini/antigravity-cli/settings.json"
      - name: Build (release)
        run: cargo build --release --verbose
      - name: Run e2e tests
        env:
          GEMINI_API_KEY: ${{ secrets.E2E_GEMINI_API_KEY }}
        run: cargo test e2e -- --ignored --nocapture
