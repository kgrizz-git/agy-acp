# Secret-gated e2e. The e2e environment must require reviewer approval and hold
# E2E_GEMINI_API_KEY; do not use a repository secret. This keeps a PR's code
# from receiving the key until a maintainer explicitly authorizes this run. Do
# not replace pull_request with pull_request_target.
name: e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    # Fork PRs cannot receive Actions secrets, so skip before requesting the
    # protected environment -- they would otherwise wait on an approval that can
    # never lead to a run. This condition needs no secret, only the event.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: e2e
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # One job references the environment, so approval is requested once. The
      # old two-job form (a `gate` job that read the secret, then this one) made
      # every protected-environment job prompt separately -- two approvals for
      # one run. The secret-presence check that `gate` did is now the first step
      # here: if the key is absent the real steps below skip via `steps.key`, so
      # a missing secret reads as a green no-op rather than a red failure, the
      # same as before.
      - id: key
        env:
          GEMINI_API_KEY: ${{ secrets.E2E_GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo 'has_key=true' >>"$GITHUB_OUTPUT"
          else
            echo 'has_key=false; skipping e2e (no E2E_GEMINI_API_KEY)' >&2
            echo 'has_key=false' >>"$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.has_key == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - if: steps.key.outputs.has_key == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          profile: minimal
      - if: steps.key.outputs.has_key == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install agy
        if: steps.key.outputs.has_key == 'true'
        # Pinned agy release and SHA-256 are deliberate compatibility inputs, as is
        # the modelProvider: gemini config below. Run the local 1.1.26 preflight
        # from plans/completed/ci-workflow.md before merging this workflow.
        run: |
          AGY_VERSION=1.1.26
          AGY_ARCHIVE="$RUNNER_TEMP/agy_cli_linux_x64.tar.gz"
          AGY_SHA256=c47c0726266b3513660b7094bceceecbd03d8ae907786aa269c507ceb7e4ee54
          curl --fail --location --retry 3 \
            --output "$AGY_ARCHIVE" \
            "https://github.com/google-antigravity/antigravity-cli/releases/download/${AGY_VERSION}/agy_cli_linux_x64.tar.gz"
          echo "${AGY_SHA256}  ${AGY_ARCHIVE}" | sha256sum --check --strict
          AGY_EXTRACT="$RUNNER_TEMP/agy-extract"
          mkdir -p "$AGY_EXTRACT" "$RUNNER_TEMP/bin"
          tar -xzf "$AGY_ARCHIVE" -C "$AGY_EXTRACT"
          # The linux_x64 archive ships the binary as `antigravity`, not
          # `agy`; accept either so a future rename does not silently break this.
          AGY_BIN=$(find "$AGY_EXTRACT" -type f \( -name agy -o -name antigravity \) -perm -u+x -print -quit)
          test -n "$AGY_BIN"
          install -m 755 "$AGY_BIN" "$RUNNER_TEMP/bin/agy"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/bin/agy" --version
      - name: Configure agy for GEMINI_API_KEY
        if: steps.key.outputs.has_key == 'true'
        # Pin a model the free-tier key can run. agy's default is a Gemini Pro
        # model that a free GEMINI_API_KEY cannot call, which aborts every turn
        # with "Agent execution terminated due to error".
        #
        # Model-issuing tests call session/set_model with a slug from
        # E2E_MODEL_ROSTER, rotated by E2E_MODEL_OFFSET (github.run_number).
        # This is an experimental mitigation for the observed
        # GenerateRequestsPerDayPerProjectPerModel-FreeTier limit: DP3/OQ1 in
        # plans/e2e-quota-rotation.md still need to establish the request/turn
        # ratio, whether reasoning variants share a bucket, and whether a
        # project-wide daily aggregate limits the benefit. settings.json
        # remains the floor for any test that does not pick a model (empty
        # roster, error_paths). That field is keyed by display label, not slug
        # (slug only works via --model / set_model), so the fallback still
        # takes column 2. The roster carries column 1.
        #
        # Rather than hardcode a version (the catalog drifts -- 3.5 was
        # dropped, 3.8 is now default), collect every `gemini-<ver>-flash-low`
        # from the live `agy models` list. Constrain the match to the Gemini
        # Flash family so a future non-Gemini, Pro (e.g. gemini-3.1-pro-low),
        # or otherwise non-free row can never be auto-selected. Fall back to
        # a known-good label if the query is empty.
        env:
          GEMINI_API_KEY: ${{ secrets.E2E_GEMINI_API_KEY }}
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          SETTINGS="$HOME/.gemini/antigravity-cli/settings.json"
          FALLBACK_LABEL="Gemini 3.6 Flash (Low)"
          # Write the fallback settings.json FIRST: `agy models` skips
          # fetchAvailableModels ("Auth mode is unspecified") and prints an
          # empty list when no cli settings exist yet (verified 2026-09-08,
          # agy 1.1.26/1.1.27: bare GEMINI_API_KEY + no settings.json →
          # empty; same key + this file → full list). jq (guaranteed on the
          # runner) builds the JSON with correct escaping. Fail loudly rather
          # than leave a truncated/empty settings.json, which would silently
          # drop agy back to its unrunnable default model.
          jq -n --arg m "$FALLBACK_LABEL" \
            '{modelProvider: "gemini", model: $m}' >"$SETTINGS"
          test -s "$SETTINGS"
          # Keep stderr: it is what distinguishes "command failed" from "no
          # slug matched the regex". (The "Fetching available models..."
          # banner always lands there too — expected noise, not an error.)
          # The `|| true` is load-bearing under `bash -e`: `agy models`
          # exits 1 when sign-in is required, and without it the step would
          # die here with no message.
          AGY_MODELS_STDERR=$(mktemp)
          MODELS_TSV=$(agy models 2>"$AGY_MODELS_STDERR" || true)
          MODEL_LINES=$(printf '%s\n' "$MODELS_TSV" | grep -c . || true)
          echo "agy models returned $MODEL_LINES non-empty line(s) on stdout"
          if [ -s "$AGY_MODELS_STDERR" ]; then
            echo "--- agy models stderr ---"
            cat "$AGY_MODELS_STDERR"
          fi
          rm -f "$AGY_MODELS_STDERR"
          # Constrain the match to the Gemini Flash family (`gemini-<ver>-flash-low`),
          # not any slug ending `-low`, so a future non-Gemini or otherwise
          # non-free row can never be auto-selected. Sort once so the roster
          # order (and hence the run_number rotation) is stable even if agy
          # reorders its list: sorting whole lines sorts by slug, since each
          # line starts with the id, and a version sort keeps 3.10 after 3.9.
          MODELS_SORTED=$(printf '%s\n' "$MODELS_TSV" | sort -V)
          ROSTER=$(printf '%s\n' "$MODELS_SORTED" | awk -F'\t' \
            '$1 ~ /^gemini-[0-9.]+-flash-low$/ { s = (s ? s "," $1 : $1) } END { print s }')
          # Newest first: older versions get dropped (3.5 was), so the live
          # label prefers the highest version over the hardcoded fallback.
          MODEL_LABEL=$(printf '%s\n' "$MODELS_SORTED" | awk -F'\t' \
            '$1 ~ /^gemini-[0-9.]+-flash-low$/ { label = $2 } END { print label }')
          if [ -z "$ROSTER" ]; then
            # Warn and continue on the settings.json default written above:
            # the roster query can still come back empty (auth drift, catalog
            # rename), and failing hard would red every run while teaching
            # nothing. Rotation engages whenever the list is non-empty; these
            # warnings make a dormant rotation visible instead of silent.
            echo "warning: e2e model roster empty; tests will use settings.json default" >&2
            MODEL_LABEL="$FALLBACK_LABEL"
          else
            n=$(printf '%s\n' "$ROSTER" | awk -F, '{ print NF }')
            if [ "$n" -eq 1 ]; then
              echo "warning: e2e model roster has one slug ($ROSTER); rotation is a no-op" >&2
            fi
            if [ -z "$MODEL_LABEL" ]; then
              # Defensive only: a non-empty roster means the regex matched at
              # least one row, so an empty label is a malformed (label-less)
              # TSV row, not catalog drift.
              echo "warning: matched model row had no display label; using fallback" >&2
              MODEL_LABEL="$FALLBACK_LABEL"
            else
              # The query just proved this label exists, so prefer it over the
              # hardcoded fallback, which rots as the catalog drifts.
              echo "refreshing e2e fallback model to live label: $MODEL_LABEL"
              jq -n --arg m "$MODEL_LABEL" \
                '{modelProvider: "gemini", model: $m}' >"$SETTINGS"
              test -s "$SETTINGS"
            fi
          fi
          echo "pinning e2e fallback model: $MODEL_LABEL"
          echo "e2e model roster: ${ROSTER:-<empty>}"
          echo "E2E_MODEL_ROSTER=$ROSTER" >> "$GITHUB_ENV"
          echo "E2E_MODEL_OFFSET=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build (release)
        if: steps.key.outputs.has_key == 'true'
        run: cargo build --release --verbose
      - name: Run e2e tests
        if: steps.key.outputs.has_key == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.E2E_GEMINI_API_KEY }}
          E2E_MODEL_ROSTER: ${{ env.E2E_MODEL_ROSTER }}
          E2E_MODEL_OFFSET: ${{ env.E2E_MODEL_OFFSET }}
        # Serialize (--test-threads=1). Each model-issuing e2e test drives a
        # real agy turn against the Gemini API, and cargo otherwise runs them
        # in parallel, so concurrent turns burst against a free-tier key whose
        # Flash quota is only a handful of requests per minute. That burst
        # intermittently aborts one turn with "Agent execution terminated due
        # to error"; running one at a time spreads the calls under the rate
        # limit. The daily per-model ceiling is a different constraint, handled
        # by rotating E2E_MODEL_ROSTER rather than by serialization.
        run: cargo test e2e -- --ignored --nocapture --test-threads=1
      - name: Capture agy logs on failure
        if: failure() && steps.key.outputs.has_key == 'true'
        # agy's stream error for a provider failure is the opaque "Agent
        # execution terminated due to error" -- the message does not distinguish
        # a 429 from an auth problem from a crash. agy writes the real detail
        # (quota_manager, HTTP status) to its own per-invocation log under
        # ~/.gemini/antigravity-cli/log/, not to stderr. Print the newest one so
        # the failure is self-describing in the log, and upload the whole set.
        run: |
          LOGDIR="$HOME/.gemini/antigravity-cli/log"
          newest=$(find "$LOGDIR" -name 'cli-*.log' -type f -print0 2>/dev/null \
            | xargs -0 -r ls -t 2>/dev/null | head -1)
          if [ -n "$newest" ] && [ -f "$newest" ]; then
            echo "=== newest agy log: $newest ==="
            tail -200 "$newest"
            tar -czf "$RUNNER_TEMP/agy-logs.tar.gz" -C "$HOME/.gemini/antigravity-cli" log
            echo "agy_logs=$RUNNER_TEMP/agy-logs.tar.gz" >> "$GITHUB_ENV"
          else
            echo "no agy cli-*.log found under $LOGDIR; nothing to upload"
          fi
      - name: Upload agy logs
        if: failure() && steps.key.outputs.has_key == 'true' && env.agy_logs != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-logs-${{ github.run_id }}
          path: ${{ env.agy_logs }}
          if-no-files-found: ignore
